# Public entry point: an Azure Standard Load Balancer in front of the frontend.
# (Phase 6 replaces this with an ingress controller and TLS.)
apiVersion: v1
kind: Service
metadata:
  name: frontend-public
  labels: { app: frontend, part-of: shopflow }
spec:
  type: LoadBalancer
  selector: { app: frontend }
  ports:
    - name: http
      port: 80
      targetPort: http
