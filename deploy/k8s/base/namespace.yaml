apiVersion: v1
kind: Namespace
metadata:
  name: shopflow
  labels:
    # Pod Security Standards: block privileged pods; warn on anything that isn't "restricted".
    # (Postgres needs "baseline" because its image starts as root before dropping privileges.)
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
