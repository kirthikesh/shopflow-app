apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  labels: { app: notification-service, part-of: shopflow }
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels: { app: notification-service }
  template:
    metadata:
      labels: { app: notification-service, part-of: shopflow }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: notification-service
          image: shopflow/notification-service
          ports:
            - name: http
              containerPort: 8084
          env:
            - name: SERVICEBUS_CONNECTION_STRING
              valueFrom:
                secretKeyRef: { name: shopflow-secrets, key: SERVICEBUS_CONNECTION_STRING }
            - name: SMTP_HOST
              value: "mailpit"
            - name: SMTP_PORT
              value: "1025"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /ready, port: http }
            periodSeconds: 5
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { memory: 192Mi }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  labels: { app: notification-service, part-of: shopflow }
spec:
  selector: { app: notification-service }
  ports:
    - name: http
      port: 8084
      targetPort: http
