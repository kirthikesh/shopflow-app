# ShopFlow application pipeline.
#
#   Pull request  ->  Test  ->  Build + scan (nothing is pushed)
#   main          ->  Test  ->  Build + scan + push
#                 ->  Release to dev   (commit tag to shopflow-gitops, Argo CD deploys, smoke test)
#                 ->  approval  ->  Promote to prod  (same tag, same checks)
#
# Runs on the self-hosted agent in the hub network and signs in to Azure with the
# agent VM's managed identity. Images are tagged with the commit they were built
# from, so every running pod can be traced back to its code.

trigger:
  branches:
    include: [main]
  paths:
    include: [services, deploy, azure-pipelines.yml, .azure-pipelines]

pr:
  branches:
    include: [main]
  paths:
    include: [services, deploy, azure-pipelines.yml, .azure-pipelines]

parameters:
  - name: services
    type: object
    default:
      - { name: product-service,      test: test-product }
      - { name: cart-service,         test: test-cart }
      - { name: order-service,        test: test-order }
      - { name: payment-service,      test: test-payment }
      - { name: notification-service, test: test-notification }
      - { name: frontend,             test: test-frontend }

pool:
  name: Default

variables:
  platformResourceGroup: rg-shopflow-platform-neu
  devResourceGroup: rg-shopflow-dev-neu
  isMain: $[ and(eq(variables['Build.SourceBranch'], 'refs/heads/main'), ne(variables['Build.Reason'], 'PullRequest')) ]

stages:
  # ---------------------------------------------------------------------------
  - stage: Test
    jobs:
      - job: test
        displayName: Unit tests and linting
        timeoutInMinutes: 30
        workspace:
          clean: all
        steps:
          - checkout: self
            clean: true

          # Each service is tested in its own language's container (see Makefile),
          # so the agent needs Docker and nothing else.
          - ${{ each svc in parameters.services }}:
              - bash: make ${{ svc.test }}
                displayName: ${{ svc.name }}

          # Test containers run as root and leave root-owned files in the
          # workspace; hand them back to the agent user so the next run can clean up.
          - bash: docker run --rm -v "$(Build.SourcesDirectory):/w" alpine:3 chown -R "$(id -u):$(id -g)" /w
            displayName: Reset workspace ownership
            condition: always()

  # ---------------------------------------------------------------------------
  - stage: Build
    dependsOn: Test
    jobs:
      - job: build
        displayName: Build, scan and push images
        timeoutInMinutes: 60
        workspace:
          clean: all
        steps:
          - checkout: self
            clean: true

          - template: .azure-pipelines/templates/azure-login.yml

          - bash: |
              set -euo pipefail
              tag="${BUILD_SOURCEVERSION:0:7}"
              echo "##vso[task.setvariable variable=imageTag]$tag"
              echo "##vso[build.addbuildtag]$tag"
              echo "Image tag: $tag"
            displayName: Image tag from commit

          - bash: az acr login --name "$(ACR)"
            displayName: Registry login
            condition: and(succeeded(), eq(variables.isMain, true))

          - ${{ each svc in parameters.services }}:
              - template: .azure-pipelines/templates/build-image.yml
                parameters:
                  service: ${{ svc.name }}
                  push: ${{ eq(variables['Build.SourceBranch'], 'refs/heads/main') }}

          - task: PublishTestResults@2
            displayName: Publish scan results
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: $(Build.ArtifactStagingDirectory)/trivy-*.xml
              testRunTitle: Trivy image scan
              failTaskOnFailedTests: false

          - publish: $(Build.ArtifactStagingDirectory)/sbom
            artifact: sbom
            displayName: Publish SBOMs
            condition: succeededOrFailed()

          - bash: docker image prune --force --filter "until=72h"
            displayName: Prune old images
            condition: always()

  # ---------------------------------------------------------------------------
  # GitOps release: main only, skipped quietly when the cluster is switched off.
  # The pipeline never runs kubectl apply for the app. It commits the image tag
  # to shopflow-gitops and Argo CD deploys it; then the pipeline verifies.
  - stage: Dev
    displayName: Release to dev
    dependsOn: Build
    condition: and(succeeded(), eq(variables.isMain, true))
    jobs:
      - job: find_cluster
        displayName: Is the cluster up?
        steps:
          - checkout: none
          - bash: |
              set -euo pipefail
              az login --identity --output none
              aks=$(az aks list -g "$(devResourceGroup)" --query "[?powerState.code=='Running'].name | [0]" -o tsv 2>/dev/null || true)
              echo "##vso[task.setvariable variable=name;isOutput=true]$aks"
              [ -n "$aks" ] && echo "Cluster: $aks" || echo "No running cluster: skipping the release."
            name: aks
            displayName: Look for a running AKS cluster

      - deployment: release_dev
        displayName: Release to dev
        dependsOn: find_cluster
        condition: and(succeeded(), ne(dependencies.find_cluster.outputs['aks.name'], ''))
        environment: shopflow-dev
        variables:
          aksName: $[ dependencies.find_cluster.outputs['aks.name'] ]
        workspace:
          clean: all
        strategy:
          runOnce:
            deploy:
              steps:
                - template: .azure-pipelines/templates/gitops-release.yml
                  parameters:
                    env: dev

  # ---------------------------------------------------------------------------
  # Same image, promoted only after a person approves on the shopflow-prod
  # environment. Nothing is rebuilt: prod gets exactly the tag dev verified.
  - stage: Prod
    displayName: Promote to prod
    dependsOn: Dev
    condition: and(succeeded(), ne(dependencies.Dev.outputs['find_cluster.aks.name'], ''))
    variables:
      aksName: $[ stageDependencies.Dev.find_cluster.outputs['aks.name'] ]
    jobs:
      - deployment: release_prod
        displayName: Promote to prod
        environment: shopflow-prod
        workspace:
          clean: all
        strategy:
          runOnce:
            deploy:
              steps:
                - template: .azure-pipelines/templates/gitops-release.yml
                  parameters:
                    env: prod
